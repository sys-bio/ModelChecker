# Every push: format, lints, tests, and a wasm32 build.
# On main: build the web page with Trunk and publish it to GitHub Pages.
# One-time setup on GitHub: Settings -> Pages -> Source: "GitHub Actions".
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRUNK_VERSION: v0.21.14
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with rustfmt, clippy and the WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: The checker builds for the browser
        run: cargo build -p mc-web --target wasm32-unknown-unknown --release

  pages:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        run: |
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin trunk
          trunk --version

      - name: Build the page
        working-directory: crates/mc-web
        run: trunk build --release --public-url ./

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: crates/mc-web/dist

      - id: deployment
        uses: actions/deploy-pages@v5
