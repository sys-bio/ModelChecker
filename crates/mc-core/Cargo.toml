[package]
name = "mc-core"
description = "Static checks for kinetic SBML models: rate law singularities, positivity, zero-order reactions, symbol use."
version.workspace = true
edition.workspace = true
license.workspace = true

# No I/O and no platform code: everything here must build for wasm32.
[dependencies]
sbml-io.workspace = true
# Checking models written in Antimony (the web page's editable panel).
antimony-rs = { workspace = true, features = ["sbml"], optional = true }
regex-lite = "0.1"

[features]
antimony = ["dep:antimony-rs"]

# Tests write their models in Antimony and convert them to SBML.
[dev-dependencies]
antimony-rs = { workspace = true, features = ["sbml"] }

[[example]]
name = "edit_roundtrip"
required-features = ["antimony"]

[[example]]
name = "report_pdf"
required-features = ["antimony"]
